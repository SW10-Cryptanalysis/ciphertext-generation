[project]
name = "ciphertext-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "dotenv>=0.9.9",
    "google-api-python-client>=2.187.0",
    "google-auth-httplib2>=0.2.1",
    "google-auth-oauthlib>=1.2.3",
    "gutenberg-cleaner>=0.1.6",
    "num2words>=0.5.14",
    "parameter-validator",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.15.0",
    "unidecode>=1.4.0",
	"easy-logging-formatter>=0.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
markers = [
	"integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
omit = [
    "src/gen_training.py", 
    "src/preprocess.py",
    "src/map_genres.py",
]

[tool.coverage.report]
exclude_also = [
	"if 0:",
    "if __name__ == .__main__.:",
	"import",
	"from",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
exclude = ["venv", ".venv", "__pycache__", "build", "dist", ".eggs", "*.egg", ".mypy_cache", ".pytest_cache"]
select = ["E", "F", "W", "C90", "B", "B9", "ANN", "COM", "D", "ERA", "ISC", "N", "Q000", "S", "SIM", "TID251", "UP", "YTT", "T"]
ignore = [
	"S311",  # Standard pseudo-random generators are not suitable for security/cryptographic purposes
	"D206",  # Docstring should be indented with spaces equal to the surrounding code
	"D100",  # Missing docstring in public module
	"D203",  # incorrect-blank-line-before-class
	"D213",  # multi-line-summary-second-line
	"UP035", # Import from `collections.abc`instead: ...
	"ANN401",# Dynamically typed expressions (typing.Any) are disallowed 
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = [
    "S101",    # Use of assert detected
    "D",       # All docstring rules
    "ANN",     # All type annotation rules
	"E501",   # Line too long
	"COM812",  # Missing trailing comma in a list or dict
	"ERA001", # Found commented-out code
	"S106",   # Possible hardcoded password
]
[tool.ruff.format]
indent-style = "space"


[tool.uv.sources]
parameter-validator = { git = "https://github.com/jatewo/parameter-validator.git" }
